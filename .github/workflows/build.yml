name: Build portable Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, feature/v0.2-diagnostics]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build portable EXE
        run: dotnet publish EthernetNightGuard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EthernetNightGuard-win-x64
          path: publish/EthernetNightGuard.exe
          if-no-files-found: error
          retention-days: 14
